services:
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: indicadores_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: indicadores
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?falta ETL_DB_PASSWORD en .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?falta API_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_datos:/var/lib/postgresql/data
      - ./db/local/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indicadores_owner -d indicadores"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_datos:
