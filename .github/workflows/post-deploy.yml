name: Post-deploy

# Después de cada push a main: espera a que el web (Vercel) y, si el push tocó api/, la API (Render)
# sirvan el commit nuevo, y corre Playwright contra producción.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: post-deploy
  cancel-in-progress: true

jobs:
  produccion:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      URL_API: ${{ vars.URL_API }}
      URL_WEB: ${{ vars.URL_WEB }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Ver si el push tocó api/
        id: api
        env:
          GH_TOKEN: ${{ github.token }}
          ANTES: ${{ github.event.before }}
        run: |
          # En una corrida manual (o rama nueva) se compara contra el padre del commit.
          if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
            ANTES=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '.parents[0].sha')
          fi
          tocados=$(gh api "repos/$GITHUB_REPOSITORY/compare/$ANTES...$SHA" --jq '.files[].filename')
          if echo "$tocados" | grep -q '^api/'; then
            echo "tocado=true" >> "$GITHUB_OUTPUT"
            echo "El push tocó api/: se espera el deploy de Render."
          else
            echo "tocado=false" >> "$GITHUB_OUTPUT"
            echo "El push no tocó api/: Render no redespliega, no se compara su versión."
          fi

      - name: Esperar el deploy (hasta 15 min)
        env:
          API_TOCADA: ${{ steps.api.outputs.tocado }}
        run: |
          limite=$((SECONDS + 900))
          espera() { # $1 nombre, $2 URL
            while [ "$SECONDS" -lt "$limite" ]; do
              version=$(curl -s --max-time 90 "$2" | jq -r '.version // empty' 2>/dev/null || true)
              if [ "$version" = "$SHA" ]; then echo "$1 sirve $SHA"; return 0; fi
              echo "$1 aún sirve '${version:-sin respuesta}'; reintento en 20 s"
              sleep 20
            done
            echo "::error::$1 no sirvió $SHA en 15 min"; return 1
          }
          espera "Web" "$URL_WEB/version"
          if [ "$API_TOCADA" = "true" ]; then
            espera "API" "$URL_API/salud/vivo"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright contra producción
        working-directory: e2e
        run: npx playwright test

      - name: Subir el reporte si falla
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Abrir el issue si falla
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          URL_CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cuerpo=$(printf 'Falló la verificación de producción para el commit **%s**.\n\nCorrida: %s\n' "$SHA" "$URL_CORRIDA")
          gh label create alerta --color B23A48 --description "Falla que requiere atención" 2>/dev/null || true
          abierto=$(gh issue list --state open --label alerta --json number,title \
            --jq '.[] | select(.title == "Falla en producción después del deploy") | .number' | head -n 1)
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" --body "$cuerpo"
          else
            gh issue create --title "Falla en producción después del deploy" --label alerta --body "$cuerpo"
          fi
