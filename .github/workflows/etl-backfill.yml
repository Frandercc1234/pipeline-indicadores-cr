name: ETL backfill

# Manual. Carga el histórico real del BCCR en Neon y después lo valida contra la fuente.
on:
  workflow_dispatch:
    inputs:
      desde:
        description: Fecha inicial de la carga (YYYY-MM-DD)
        required: true
        default: "2015-01-01"

permissions:
  contents: read

concurrency: etl

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - name: Instalar dependencias del ETL
        run: pip install -r etl/requirements.txt
      - name: Backfill
        working-directory: etl
        env:
          BCCR_MODO: real
          BCCR_BASE_URL: https://apim.bccr.fi.cr/SDDE/api/Bccr.GE.SDDE.Publico.Indicadores.API
          BCCR_TOKEN: ${{ secrets.BCCR_TOKEN }}
          DATABASE_URL_ETL: ${{ secrets.DATABASE_URL_ETL }}
          DESDE: ${{ inputs.desde }}
        run: python -m etl backfill --desde "$DESDE"
      - name: Validar contra el BCCR
        working-directory: etl
        env:
          BCCR_MODO: real
          BCCR_BASE_URL: https://apim.bccr.fi.cr/SDDE/api/Bccr.GE.SDDE.Publico.Indicadores.API
          BCCR_TOKEN: ${{ secrets.BCCR_TOKEN }}
          DATABASE_URL_ETL: ${{ secrets.DATABASE_URL_ETL }}
        run: python -m etl validar
      - name: Resumen en Neon
        working-directory: etl
        env:
          DATABASE_URL_ETL: ${{ secrets.DATABASE_URL_ETL }}
        run: |
          python - <<'PY'
          import os

          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL_ETL"], connect_timeout=30) as conn:
              print("indicador | filas | primera fecha | última fecha")
              for fila in conn.execute(
                  "SELECT i.slug, count(*), min(o.fecha), max(o.fecha) FROM observacion o "
                  "JOIN indicador i ON i.id = o.indicador_id GROUP BY i.id, i.slug ORDER BY i.id"
              ):
                  print(" | ".join(str(c) for c in fila))
              print("rol | superuser | createrole | createdb | bypassrls")
              for fila in conn.execute(
                  "SELECT rolname, rolsuper, rolcreaterole, rolcreatedb, rolbypassrls "
                  "FROM pg_roles WHERE rolname IN ('etl_writer', 'api_reader') ORDER BY 1"
              ):
                  print(" | ".join(str(c) for c in fila))
          PY
