name: Migrar

# Manual. Aplica las migraciones de db/migrations en Neon y siembra la tabla indicador.
# Es el único workflow que usa el rol dueño (DATABASE_URL_ADMIN).
on: workflow_dispatch

permissions:
  contents: read

jobs:
  migrar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - name: Instalar dependencias del ETL
        run: pip install -r etl/requirements.txt
      - name: Aplicar migraciones
        working-directory: etl
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: python -m etl migrar
